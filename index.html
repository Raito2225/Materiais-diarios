<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel de Materiais - NTI</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            color: #333;
            margin: 0;
            padding: 20px;
        }
        .container { max-width: 1200px; margin: 0 auto; }
        
        h1 {
            color: #1c4587;
            text-align: center;
            margin-bottom: 30px;
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        
        .secao-turno {
            background: white;
            margin-bottom: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            overflow: hidden;
        }
        .cabecalho-turno {
            padding: 15px 20px;
            color: white;
            font-size: 1.5em;
            font-weight: bold;
        }
        .bg-manha { background-color: #f39c12; } 
        .bg-tarde { background-color: #d35400; } 
        .bg-noite { background-color: #2c3e50; } 

        table { width: 100%; border-collapse: collapse; }
        th, td {
            padding: 12px 15px;
            text-align: left;
            border-bottom: 1px solid #ddd;
            vertical-align: top;
        }
        th { background-color: #f8f9fa; color: #333; font-weight: bold; }
        tr:hover { background-color: #f1f1f1; }
        
        .disciplina-caixa {
            background-color: #e9ecef;
            padding: 4px 8px;
            border-radius: 4px;
            display: inline-block;
            margin-bottom: 4px;
            font-size: 0.9em;
        }
        
        .status {
            padding: 6px 12px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 0.85em;
            display: inline-block;
            margin-bottom: 8px;
        }
        .status-ok { background-color: #d4edda; color: #155724; }
        .status-pendente { background-color: #fff3cd; color: #856404; }
        
        .motivo-caixa {
            background-color: #f8d7da;
            color: #721c24;
            padding: 6px 10px;
            border-radius: 6px;
            font-size: 0.85em;
            border-left: 4px solid #dc3545;
            display: inline-block;
            margin-top: 5px;
            max-width: 100%;
            word-wrap: break-word;
        }

        .arquivos {
            white-space: pre-wrap; 
            font-size: 0.9em;
            color: #555;
        }
        .sem-aulas {
            padding: 20px;
            text-align: center;
            color: #777;
            font-style: italic;
        }
        
        .aviso-erro {
            background-color: #fff3cd;
            color: #856404;
            padding: 20px;
            text-align: center;
            border-radius: 8px;
            font-weight: bold;
            margin-top: 20px;
            border: 2px solid #ffeeba;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Painel de Upload de Materiais</h1>
    <div id="painel-dinamico">
        <p style="text-align: center; color: #666;">Carregando os materiais...</p>
    </div>
</div>

<script>
    // Nova URL CSV fornecida
    const urlCSV = "https://docs.google.com/spreadsheets/d/e/2PACX-1vQzOpsfYYKsQDhGX8YKRql5WSY1J-DVc8aRTm2jOc9qD2LnV21KBE4ZoeZFzubJd2N28T7z02FkPP_V/pub?gid=1550988071&single=true&output=csv";
    const painel = document.getElementById("painel-dinamico");

    function carregarDados() {
        Papa.parse(urlCSV, {
            download: true,
            header: false,
            complete: function(results) {
                const dados = results.data;
                
                let manha = [];
                let tarde = [];
                let noite = [];

                if (dados.length <= 1) {
                    painel.innerHTML = `
                        <div class="aviso-erro">
                            ⚠️ A planilha está conectada com sucesso, mas não encontrei nenhuma linha de dados preenchida na aba <b>Controle_Materiais</b>.<br>
                            Preencha pelo menos uma linha com data, turno e turma para os blocos aparecem aqui!
                        </div>
                    `;
                    return;
                }

                for (let i = 1; i < dados.length; i++) {
                    const linha = dados[i];
                    if (!linha[0] || linha[0].trim() === "") continue;

                    const turno = linha[1] ? linha[1].trim() : "";
                    if (turno === "Manhã") manha.push(linha);
                    else if (turno === "Tarde") tarde.push(linha);
                    else if (turno === "Noite") noite.push(linha);
                }

                painel.innerHTML = ""; 

                painel.appendChild(criarSecaoTurno("☀️ Manhã", "bg-manha", manha));
                painel.appendChild(criarSecaoTurno("🌇 Tarde", "bg-tarde", tarde));
                painel.appendChild(criarSecaoTurno("🌙 Noite", "bg-noite", noite));
            },
            error: function(erro) {
                painel.innerHTML = `
                    <div class="aviso-erro" style="background-color: #f8d7da; color: #721c24; border-color: #f5c6cb;">
                        🚨 Erro ao ler a planilha. Verifique se o link CSV está correto e se a aba foi publicada na web.
                    </div>
                `;
            }
        });
    }

    function criarSecaoTurno(titulo, classeCor, linhasDeDados) {
        const divSecao = document.createElement("div");
        divSecao.className = "secao-turno";

        const divCabecalho = document.createElement("div");
        divCabecalho.className = `cabecalho-turno ${classeCor}`;
        divCabecalho.innerText = titulo;
        divSecao.appendChild(divCabecalho);

        if (linhasDeDados.length === 0) {
            const divVazia = document.createElement("div");
            divVazia.className = "sem-aulas";
            divVazia.innerText = "Nenhuma aula registrada para este turno ainda.";
            divSecao.appendChild(divVazia);
            return divSecao;
        }

        const tabela = document.createElement("table");
        tabela.innerHTML = `
            <thead>
                <tr>
                    <th width="10%">Data</th>
                    <th width="20%">Turma</th>
                    <th width="20%">Disciplinas</th>
                    <th width="30%">Arquivos Disponíveis</th>
                    <th width="20%">Status</th>
                </tr>
            </thead>
            <tbody></tbody>
        `;

        const tbody = tabela.querySelector("tbody");

        linhasDeDados.forEach(linha => {
            const dataAula = linha[0] || "";
            const turma = linha[2] || "";
            const disc1 = linha[3] ? `<div class="disciplina-caixa">1º: ${linha[3]}</div>` : "";
            const disc2 = linha[4] ? `<div class="disciplina-caixa">2º: ${linha[4]}</div>` : "";
            const arquivos = linha[5] || "";
            const subido = linha[6] === "TRUE";
            const dataUpload = linha[7] || "";
            const motivo = linha[8] || ""; 

            let statusHtml = "";
            let motivoHtml = "";

            if (subido) {
                statusHtml = `<div class="status status-ok">✅ No Site</div><br><small>${dataUpload}</small>`;
            } else {
                statusHtml = `<div class="status status-pendente">⏳ Pendente</div>`;
                if (motivo.trim() !== "") {
                    motivoHtml = `<div class="motivo-caixa">⚠️ ${motivo}</div>`;
                }
            }

            const tr = document.createElement("tr");
            tr.innerHTML = `
                <td><strong>${dataAula}</strong></td>
                <td>${turma}</td>
                <td>${disc1}<br>${disc2}</td>
                <td class="arquivos">${arquivos}</td>
                <td>
                    ${statusHtml}
                    ${motivoHtml}
                </td>
            `;
            tbody.appendChild(tr);
        });

        divSecao.appendChild(tabela);
        return divSecao;
    }

    window.onload = carregarDados;
</script>

</body>
</html>

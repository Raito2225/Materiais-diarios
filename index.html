<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel de Materiais - NTI Quad Concursos</title>
    <!-- Favicon Personalizado (Ícone na aba do navegador) -->
    <link rel="icon" href="https://fav.farm/📖" />
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
    <style>
        /* Tema Claro */
        :root {
            --cor-manha: #f39c12;
            --cor-tarde: #d35400;
            --cor-noite: #2c3e50;
            --cor-fundo: #f4f7f6;
            --cor-texto: #333;
            --cor-container-bg: white;
            --cor-th-bg: #f8fafc;
            --cor-th-text: #64748b;
            --cor-borda: #edf2f7;
            --cor-hover: #f9fafb;
            --cor-disc-bg: #e2e8f0;
            --cor-disc-texto: #334155;
            --cor-titulo-h1: #1c4587;
            --cor-input-bg: #ffffff;
            --cor-input-border: #cbd5e1;
            --cor-btn-filtro-bg: #e2e8f0;
            --cor-btn-filtro-texto: #334155;
            --cor-progresso-bg: #e2e8f0;
            --cor-progresso-barra: #22c55e;
        }

        /* Tema Escuro */
        body.dark-mode {
            --cor-fundo: #121212;
            --cor-texto: #e2e8f0;
            --cor-container-bg: #1e1e1e;
            --cor-th-bg: #2d3748;
            --cor-th-text: #a0aec0;
            --cor-borda: #2d3748;
            --cor-hover: #2a2a2a;
            --cor-disc-bg: #4a5568;
            --cor-disc-texto: #e2e8f0;
            --cor-titulo-h1: #63b3ed;
            --cor-input-bg: #2d3748;
            --cor-input-border: #4a5568;
            --cor-btn-filtro-bg: #4a5568;
            --cor-btn-filtro-texto: #e2e8f0;
            --cor-progresso-bg: #2d3748;
            --cor-progresso-barra: #4ade80;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--cor-fundo);
            color: var(--cor-texto);
            margin: 0;
            padding: 20px;
            line-height: 1.6;
            transition: background-color 0.3s, color 0.3s;
        }

        .container { max-width: 1000px; margin: 0 auto; }
        
        h1 {
            color: var(--cor-titulo-h1);
            text-align: center;
            margin-bottom: 15px;
            background: var(--cor-container-bg);
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            font-size: 1.8em;
            transition: background-color 0.3s, color 0.3s;
        }

        /* O Cronômetro Mágico */
        .timer-container {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            font-size: 0.95em;
            color: var(--cor-th-text);
            background-color: var(--cor-container-bg);
            padding: 8px 20px;
            border-radius: 30px;
            width: fit-content;
            margin: 0 auto 20px auto;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
            transition: background-color 0.3s, color 0.3s;
        }
        .timer-container strong {
            color: var(--cor-titulo-h1);
            font-size: 1.1em;
            font-variant-numeric: tabular-nums;
        }

        /* Barra de Progresso do Dia */
        .progresso-container {
            background-color: var(--cor-container-bg);
            padding: 15px 25px;
            border-radius: 12px;
            margin-bottom: 25px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
            transition: background-color 0.3s;
        }
        .progresso-info {
            display: flex;
            justify-content: space-between;
            font-size: 0.95em;
            font-weight: 600;
            margin-bottom: 8px;
            color: var(--cor-texto);
        }
        .progresso-barra-fundo {
            width: 100%;
            height: 12px;
            background-color: var(--cor-progresso-bg);
            border-radius: 6px;
            overflow: hidden;
        }
        .progresso-barra-preenchimento {
            height: 100%;
            background-color: var(--cor-progresso-barra);
            width: 0%;
            transition: width 0.5s ease;
            border-radius: 6px;
        }

        /* Controles de Busca e Filtro */
        .controles-container {
            display: flex;
            gap: 12px;
            justify-content: center;
            margin-bottom: 10px;
            flex-wrap: wrap;
        }
        .busca-input {
            flex: 1;
            max-width: 320px;
            padding: 14px 20px;
            font-size: 1.05em;
            border: 2px solid var(--cor-input-border);
            border-radius: 30px;
            background-color: var(--cor-input-bg);
            color: var(--cor-texto);
            outline: none;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
            transition: border-color 0.3s;
        }
        .busca-input:focus { border-color: var(--cor-titulo-h1); }

        /* Instrução dos Filtros */
        .instrucao-filtros {
            text-align: center;
            font-size: 0.9em;
            color: var(--cor-th-text);
            margin-bottom: 30px;
        }

        /* Botões de Filtro e Master Toggle */
        .btn-acao {
            padding: 0 18px;
            font-size: 0.95em;
            font-weight: 600;
            border: 2px solid var(--cor-input-border);
            border-radius: 30px;
            background-color: var(--cor-btn-filtro-bg);
            color: var(--cor-btn-filtro-texto);
            cursor: pointer;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
            transition: all 0.3s;
            display: flex;
            align-items: center;
            gap: 8px;
            white-space: nowrap;
            height: 50px;
        }
        .btn-acao:hover { opacity: 0.9; }
        
        #btn-filtro-pendentes.ativo {
            background-color: #fef08a;
            color: #854d0e;
            border-color: #eab308;
        }
        #btn-filtro-publicados.ativo {
            background-color: #dcfce7;
            color: #166534;
            border-color: #22c55e;
        }

        .badge-contador {
            background-color: #ef4444;
            color: white;
            padding: 2px 8px;
            border-radius: 12px;
            font-size: 0.85em;
            font-weight: bold;
        }
        #btn-filtro-pendentes.ativo .badge-contador {
            background-color: #ca8a04;
            color: white;
        }

        /* Estilização do Turno e Badge no Título */
        .turno-bloco { margin-bottom: 40px; }
        .turno-titulo {
            padding: 12px 20px;
            color: white;
            font-size: 1.3em;
            font-weight: 600;
            border-radius: 8px 8px 0 0;
            margin-bottom: 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .badge-turno {
            background-color: rgba(0, 0, 0, 0.25);
            color: white;
            padding: 3px 12px;
            border-radius: 20px;
            font-size: 0.8em;
            font-weight: normal;
        }

        .bg-manha { background-color: var(--cor-manha); } 
        .bg-tarde { background-color: var(--cor-tarde); } 
        .bg-noite { background-color: var(--cor-noite); } 

        .turno-conteudo { padding-top: 15px; }

        details {
            background: var(--cor-container-bg);
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
            margin-bottom: 12px;
            overflow: hidden;
            transition: all 0.3s ease;
        }
        summary {
            padding: 16px 20px;
            font-weight: 600;
            font-size: 1.1em;
            cursor: pointer;
            color: var(--cor-titulo-h1);
            display: flex;
            justify-content: space-between;
            align-items: center;
            list-style: none;
            user-select: none;
        }
        summary::-webkit-details-marker { display: none; }
        summary::after {
            content: "▼";
            font-size: 0.8em;
            color: #888;
            transition: transform 0.3s ease;
        }
        details[open] summary::after { transform: rotate(180deg); }
        details[open] summary {
            border-bottom: 1px solid var(--cor-borda);
            background-color: var(--cor-th-bg);
        }

        .tabela-wrapper { overflow-x: auto; }
        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.95em;
        }
        th, td {
            padding: 15px 20px;
            text-align: left;
            border-bottom: 1px solid var(--cor-borda);
            vertical-align: middle;
        }
        th {
            background-color: var(--cor-th-bg);
            color: var(--cor-th-text);
            font-weight: 600;
            text-transform: uppercase;
            font-size: 0.8em;
        }
        tr:last-child td { border-bottom: none; }
        tr:hover { background-color: var(--cor-hover); }
        
        .disciplina-caixa {
            background-color: var(--cor-disc-bg);
            color: var(--cor-disc-texto);
            padding: 6px 12px;
            border-radius: 6px;
            display: inline-block;
            font-size: 0.9em;
            font-weight: 600;
        }
        
        .status {
            padding: 6px 12px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 0.85em;
            display: inline-flex;
        }
        .status-ok { background-color: #dcfce7; color: #166534; }
        .status-pendente { background-color: #fef08a; color: #854d0e; }
        
        .motivo-caixa {
            background-color: #fee2e2;
            color: #991b1b;
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 0.85em;
            border-left: 4px solid #ef4444;
            display: inline-block;
        }

        .sem-aulas {
            padding: 20px;
            text-align: center;
            color: var(--cor-th-text);
            background: var(--cor-container-bg);
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        }
        
        .erro-msg {
            background-color: #fee2e2;
            color: #991b1b;
            padding: 20px;
            border-radius: 8px;
            text-align: center;
            font-weight: bold;
            border: 2px solid #ef4444;
        }

        /* Rodapé Institucional */
        footer {
            text-align: center;
            margin-top: 50px;
            margin-bottom: 20px;
            color: var(--cor-th-text);
            font-size: 0.9em;
            border-top: 1px solid var(--cor-borda);
            padding-top: 20px;
        }

        /* Botão Tema Dark/Light */
        .tema-btn {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background-color: var(--cor-titulo-h1);
            color: white;
            border: none;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            font-size: 1.5em;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
            transition: transform 0.2s, background-color 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }
        .tema-btn:hover { transform: scale(1.1); }
    </style>
</head>
<body>

<button id="btn-tema" class="tema-btn" onclick="alternarTema()">🌙</button>

<div class="container">
    <h1>Painel de Upload de Materiais</h1>
    
    <!-- Reloginho Visível -->
    <div class="timer-container">
        <span>⏱️ Atualiza automaticamente em:</span>
        <strong id="contador-tempo">05:00</strong>
    </div>

    <!-- Barra de Progresso Geral do Dia -->
    <div class="progresso-container">
        <div class="progresso-info">
            <span>📊 Progresso de Publicação do Dia</span>
            <span id="progresso-texto">0% Concluído (0/0)</span>
        </div>
        <div class="progresso-barra-fundo">
            <div id="progresso-preenchimento" class="progresso-barra-preenchimento"></div>
        </div>
    </div>
    
    <!-- Controles (Busca + Filtros + Master Toggle) -->
    <div class="controles-container">
        <input type="text" id="input-busca" class="busca-input" placeholder="🔍 Pesquisar turma/disciplina..." onkeyup="aplicarFiltros()">
        
        <button id="btn-filtro-pendentes" class="btn-acao" onclick="alternarFiltro('pendentes')">
            ⏳ Pendentes <span id="badge-pendentes" class="badge-contador">0</span>
        </button>
        
        <button id="btn-filtro-publicados" class="btn-acao" onclick="alternarFiltro('publicados')">
            ✅ Publicados
        </button>

        <button id="btn-master-toggle" class="btn-acao" onclick="alternarExpandirTudo()">
            📂 Expandir Tudo
        </button>
    </div>
    
    <div class="instrucao-filtros">
        👆 <em>Utilize os botões acima para filtrar ou expandir/recolher todas as turmas do painel.</em>
    </div>

    <div id="painel-dinamico">
        <p style="text-align: center; color: var(--cor-th-text);">Buscando dados no sistema...</p>
    </div>

    <!-- Rodapé -->
    <footer>
        <strong>N.T.I</strong> - Núcleo de Tecnologia e Inovações | Quad Concursos
    </footer>
</div>

<script>
    const urlCSV = "https://docs.google.com/spreadsheets/d/e/2PACX-1vQzOpsfYYKsQDhGX8YKRql5WSY1J-DVc8aRTm2jOc9qD2LnV21KBE4ZoeZFzubJd2N28T7z02FkPP_V/pub?gid=424030956&single=true&output=csv";
    const painel = document.getElementById("painel-dinamico");

    let filtroAtivo = null; 
    let totalPendentesGeral = 0;
    let totalMateriaisGeral = 0;
    let totalPublicadosGeral = 0;
    let tudoExpandido = false;

    // LÓGICA DO CRONÔMETRO (5 minutos = 300 segundos)
    let tempoRestante = 300; 
    const displayTempo = document.getElementById('contador-tempo');

    function atualizarCronometro() {
        let minutos = Math.floor(tempoRestante / 60);
        let segundos = tempoRestante % 60;
        
        minutos = minutos < 10 ? '0' + minutos : minutos;
        segundos = segundos < 10 ? '0' + segundos : segundos;
        
        displayTempo.innerText = minutos + ':' + segundos;
        
        if (tempoRestante > 0) {
            tempoRestante--;
        } else {
            window.location.reload();
        }
    }
    setInterval(atualizarCronometro, 1000);

    // LÓGICA DO TEMA
    function carregarTemaSalvo() {
        try {
            if (localStorage.getItem('tema-escuro') === 'true') {
                document.body.classList.add('dark-mode');
                document.getElementById('btn-tema').innerText = '☀️';
            }
        } catch (e) { console.warn("Modo escuro bloqueado localmente."); }
    }

    function alternarTema() {
        const body = document.body;
        const btn = document.getElementById('btn-tema');
        body.classList.toggle('dark-mode');
        try {
            if (body.classList.contains('dark-mode')) {
                localStorage.setItem('tema-escuro', 'true');
                btn.innerText = '☀️';
            } else {
                localStorage.setItem('tema-escuro', 'false');
                btn.innerText = '🌙';
            }
        } catch (e) {
            btn.innerText = body.classList.contains('dark-mode') ? '☀️' : '🌙';
        }
    }
    carregarTemaSalvo();

    // BOTÃO MESTRE: EXPANDIR / RECOLHER TUDO
    function alternarExpandirTudo() {
        const detalhesTurmas = document.querySelectorAll('details');
        const btnMaster = document.getElementById('btn-master-toggle');
        
        tudoExpandido = !tudoExpandido;
        
        detalhesTurmas.forEach(details => {
            // Só altera se a turma estiver visível na tela
            if (details.style.display !== 'none') {
                details.open = tudoExpandido;
            }
        });

        if (tudoExpandido) {
            btnMaster.innerHTML = '📁 Recolher Tudo';
        } else {
            btnMaster.innerHTML = '📂 Expandir Tudo';
        }
    }

    // ATUALIZAÇÃO DA BARRA DE PROGRESSO
    function atualizarBarraProgresso() {
        let porcentagem = 0;
        if (totalMateriaisGeral > 0) {
            porcentagem = Math.round((totalPublicadosGeral / totalMateriaisGeral) * 100);
        }
        
        document.getElementById('progresso-texto').innerText = `${porcentagem}% Concluído (${totalPublicadosGeral}/${totalMateriaisGeral})`;
        document.getElementById('progresso-preenchimento').style.width = `${porcentagem}%`;
    }

    // GERENCIAMENTO DOS FILTROS (EXCLUSIVOS)
    function alternarFiltro(tipo) {
        const btnPendentes = document.getElementById('btn-filtro-pendentes');
        const btnPublicados = document.getElementById('btn-filtro-publicados');

        if (filtroAtivo === tipo) {
            filtroAtivo = null;
            btnPendentes.classList.remove('ativo');
            btnPublicados.classList.remove('ativo');
        } else {
            filtroAtivo = tipo;
            if (tipo === 'pendentes') {
                btnPendentes.classList.add('ativo');
                btnPublicados.classList.remove('ativo');
            } else {
                btnPublicados.classList.add('ativo');
                btnPendentes.classList.remove('ativo');
            }
        }
        aplicarFiltros();
    }

    // ATUALIZA O BADGE COM O TOTAL DE PENDENTES
    function atualizarContadorBadge() {
        document.getElementById('badge-pendentes').innerText = totalPendentesGeral;
    }

    // FILTRO COMBINADO (LUPA + BOTÕES DE FILTRAGEM)
    function aplicarFiltros() {
        const termoBusca = document.getElementById('input-busca').value.toLowerCase();
        const detalhesTurmas = document.querySelectorAll('details');
        
        detalhesTurmas.forEach(details => {
            const textoTurma = details.innerText.toLowerCase();
            const passaNoTexto = textoTurma.includes(termoBusca);
            
            const linhasMateria = details.querySelectorAll('tbody tr');
            let linhasVisiveisNaTurma = 0;

            linhasMateria.forEach(tr => {
                const statusCell = tr.querySelector('.status');
                const isPendente = statusCell && statusCell.classList.contains('status-pendente');
                const isPublicado = statusCell && statusCell.classList.contains('status-ok');
                
                let mostrarLinha = true;

                if (filtroAtivo === 'pendentes' && !isPendente) {
                    mostrarLinha = false;
                } else if (filtroAtivo === 'publicados' && !isPublicado) {
                    mostrarLinha = false;
                }

                if (mostrarLinha) {
                    tr.style.display = '';
                    linhasVisiveisNaTurma++;
                } else {
                    tr.style.display = 'none';
                }
            });

            if (passaNoTexto && linhasVisiveisNaTurma > 0) {
                details.style.display = 'block';
                if (termoBusca !== "" || filtroAtivo !== null) {
                    details.open = true;
                }
            } else {
                details.style.display = 'none';
            }
        });
        
        const blocosTurno = document.querySelectorAll('.turno-bloco');
        blocosTurno.forEach(bloco => {
            const turmasVisiveis = bloco.querySelectorAll('details[style*="display: block"]');
            if (turmasVisiveis.length === 0) {
                bloco.style.display = 'none';
            } else {
                bloco.style.display = 'block';
            }
        });
    }

    // LÓGICA DE DADOS
    function parseDataAula(dataStr) {
        let partes = dataStr.split('/');
        let dia = parseInt(partes[0], 10);
        let mes = parseInt(partes[1], 10) - 1; 
        let ano = partes.length > 2 ? parseInt(partes[2], 10) : new Date().getFullYear();
        return new Date(ano, mes, dia);
    }

    function carregarDados() {
        Papa.parse(urlCSV, {
            download: true,
            header: false,
            complete: function(results) {
                try {
                    const dados = results.data;
                    const agora = new Date();
                    
                    if (!dados || dados.length <= 1) {
                        painel.innerHTML = `<div class="erro-msg">⚠️ A planilha está vazia ou os dados não puderam ser lidos.</div>`;
                        return;
                    }

                    let turmasOrganizadas = { "Manhã": {}, "Tarde": {}, "Noite": {} };
                    totalPendentesGeral = 0;
                    totalMateriaisGeral = 0;
                    totalPublicadosGeral = 0;

                    for (let i = 1; i < dados.length; i++) {
                        const linha = dados[i];
                        if (!linha[0] || linha[0].trim() === "") continue;

                        let dataStr = linha[0].trim();
                        let turno = linha[1] ? linha[1].trim() : "";
                        let turma = linha[2] ? linha[2].trim() : "Turma Não Informada";

                        if (!["Manhã", "Tarde", "Noite"].includes(turno)) continue;

                        let dataAula = parseDataAula(dataStr);
                        if (isNaN(dataAula.getTime())) continue; 

                        let dataExpiracao = new Date(dataAula.getTime());

                        if (turno === "Manhã") {
                            dataExpiracao.setHours(12, 0, 0, 0);
                        } else {
                            dataExpiracao.setDate(dataExpiracao.getDate() + 1);
                            dataExpiracao.setHours(0, 0, 0, 0);
                        }

                        if (agora > dataExpiracao) continue; 

                        const disc1 = linha[3] || "";
                        const subido1 = linha[4] === "TRUE";
                        const disc2 = linha[7] || "";
                        const subido2 = linha[8] === "TRUE";

                        // Contabiliza Disciplina 1
                        if (disc1.trim() !== "") {
                            totalMateriaisGeral++;
                            if (subido1) totalPublicadosGeral++;
                            else totalPendentesGeral++;
                        }

                        // Contabiliza Disciplina 2
                        if (disc2.trim() !== "") {
                            totalMateriaisGeral++;
                            if (subido2) totalPublicadosGeral++;
                            else totalPendentesGeral++;
                        }

                        if (!turmasOrganizadas[turno][turma]) {
                            turmasOrganizadas[turno][turma] = [];
                        }
                        turmasOrganizadas[turno][turma].push(linha);
                    }

                    painel.innerHTML = ""; 
                    painel.appendChild(criarBlocoTurno("Manhã", "bg-manha", turmasOrganizadas["Manhã"]));
                    painel.appendChild(criarBlocoTurno("Tarde", "bg-tarde", turmasOrganizadas["Tarde"]));
                    painel.appendChild(criarBlocoTurno("Noite", "bg-noite", turmasOrganizadas["Noite"]));
                    
                    atualizarContadorBadge();
                    atualizarBarraProgresso();
                    aplicarFiltros();
                } catch (erro) {
                    painel.innerHTML = `<div class="erro-msg">🚨 Erro ao processar dados: ${erro.message}</div>`;
                }
            },
            error: function(erro) {
                painel.innerHTML = `<div class="erro-msg">🚨 Falha ao baixar os dados do Google Sheets. Verifique o link.</div>`;
            }
        });
    }

    function criarBlocoTurno(nomeTurno, classeCor, dadosTurmas) {
        const divTurno = document.createElement("div");
        divTurno.className = "turno-bloco";

        let pendentesNoTurno = 0;
        Object.keys(dadosTurmas).forEach(nomeTurma => {
            dadosTurmas[nomeTurma].forEach(linha => {
                const disc1 = linha[3] || "";
                const subido1 = linha[4] === "TRUE";
                const disc2 = linha[7] || "";
                const subido2 = linha[8] === "TRUE";
                
                if (disc1.trim() !== "" && !subido1) pendentesNoTurno++;
                if (disc2.trim() !== "" && !subido2) pendentesNoTurno++;
            });
        });

        const divCabecalho = document.createElement("div");
        divCabecalho.className = `turno-titulo ${classeCor}`;
        
        let iconeTurno = nomeTurno === "Manhã" ? "☀️" : (nomeTurno === "Tarde" ? "🌇" : "🌙");
        
        divCabecalho.innerHTML = `
            <span>${iconeTurno} Turno da ${nomeTurno}</span>
            <span class="badge-turno">⏳ ${pendentesNoTurno} ${pendentesNoTurno === 1 ? 'pendente' : 'pendentes'}</span>
        `;
        divTurno.appendChild(divCabecalho);

        const divConteudo = document.createElement("div");
        divConteudo.className = "turno-conteudo";

        const nomesTurmas = Object.keys(dadosTurmas);

        if (nomesTurmas.length === 0) {
            const divVazia = document.createElement("div");
            divVazia.className = "sem-aulas";
            divVazia.innerText = "Nenhum material pendente ou disponível para este turno.";
            divConteudo.appendChild(divVazia);
        } else {
            nomesTurmas.forEach(nomeTurma => {
                const details = document.createElement("details");
                
                let temPendente = false;
                dadosTurmas[nomeTurma].forEach(linha => {
                    const disc1 = linha[3] || "";
                    const subido1 = linha[4] === "TRUE";
                    const disc2 = linha[7] || "";
                    const subido2 = linha[8] === "TRUE";
                    
                    if (disc1.trim() !== "" && !subido1) temPendente = true;
                    if (disc2.trim() !== "" && !subido2) temPendente = true;
                });
                
                details.open = tudoExpandido ? true : temPendente; 
                
                const summary = document.createElement("summary");
                summary.innerText = nomeTurma;
                details.appendChild(summary);

                const divTabela = document.createElement("div");
                divTabela.className = "tabela-wrapper";

                const tabela = document.createElement("table");
                
                tabela.innerHTML = `
                    <thead>
                        <tr>
                            <th width="15%">Data da Aula</th>
                            <th width="30%">Disciplina</th>
                            <th width="20%">Status no Site</th>
                            <th width="35%">Observação</th>
                        </tr>
                    </thead>
                    <tbody></tbody>
                `;

                const tbody = tabela.querySelector("tbody");

                dadosTurmas[nomeTurma].forEach(linha => {
                    let dataAula = linha[0];
                    if(dataAula && dataAula.length >= 5) {
                        dataAula = dataAula.substring(0, 5);
                    }
                    
                    const disc1 = linha[3] || "";
                    const subido1 = linha[4] === "TRUE";
                    const dataUpload1 = linha[5] || "";
                    const motivo1 = linha[6] || ""; 

                    const disc2 = linha[7] || "";
                    const subido2 = linha[8] === "TRUE";
                    const dataUpload2 = linha[9] || "";
                    const motivo2 = linha[10] || ""; 

                    function gerarLinhaMateria(nomeDisc, numDisc, status, upload, motivoTxt) {
                        if (nomeDisc.trim() === "") return ""; 

                        let statusHtml = "";
                        let motivoHtml = "";

                        if (status) {
                            statusHtml = `<div class="status status-ok">✅ Publicado</div><div style="font-size: 0.8em; margin-top: 4px; color: var(--cor-th-text);">Em: ${upload}</div>`;
                        } else {
                            statusHtml = `<div class="status status-pendente">⏳ Pendente</div>`;
                            if (motivoTxt.trim() !== "") {
                                motivoHtml = `<div class="motivo-caixa">⚠️ ${motivoTxt}</div>`;
                            }
                        }

                        return `
                            <tr>
                                <td><strong>${dataAula}</strong></td>
                                <td><div class="disciplina-caixa">${numDisc}: ${nomeDisc}</div></td>
                                <td>${statusHtml}</td>
                                <td>${motivoHtml}</td>
                            </tr>
                        `;
                    }

                    tbody.innerHTML += gerarLinhaMateria(disc1, "1º", subido1, dataUpload1, motivo1);
                    tbody.innerHTML += gerarLinhaMateria(disc2, "2º", subido2, dataUpload2, motivo2);
                });

                divTabela.appendChild(tabela);
                details.appendChild(divTabela);
                divConteudo.appendChild(details);
            });
        }

        divTurno.appendChild(divConteudo);
        return divTurno;
    }

    window.onload = carregarDados;
</script>

</body>
</html>
